inhibit_rules:
  # If cardano-node is down, suppress the chain-stall alert — they're the same
  # incident. No point getting paged twice for a single failure.
  - source_match:
      alertname: ServiceDown
      job: cardano-node
    target_match:
      alertname: CardanoChainStall
    equal: []
  # Same for midnight-node.
  - source_match:
      alertname: ServiceDown
      job: midnight-node
    target_match:
      alertname: MidnightChainStall
    equal: []
