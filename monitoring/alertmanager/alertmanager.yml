global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: log-receiver

  routes:
    - match:
        severity: critical
      receiver: log-receiver
      repeat_interval: 15m
    - match:
        severity: warning
      receiver: log-receiver
      repeat_interval: 1h

receivers:
  # Logging receiver used in preprod/development — all alerts are written to
  # Alertmanager logs for inspection. In production replace with PagerDuty
  # or a webhook to an on-call system (e.g. OpsGenie, VictorOps).
  - name: log-receiver
    webhook_configs: []

# Silence repeated alerts during planned maintenance.
# Run: curl -X POST localhost:9093/api/v2/silences -d '{"comment":"Planned restart",...}'
inhibit_rules:
  # If the node service itself is down, suppress the chain-stall alert —
  # the ServiceDown alert already fires and the chain-stall is a downstream effect.
  - source_match:
      alertname: ServiceDown
      job: cardano-node
    target_match:
      alertname: CardanoChainStall
    equal: []
