global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: noop

  routes:
    - match:
        severity: critical
      receiver: noop
      repeat_interval: 15m
    - match:
        severity: warning
      receiver: noop
      repeat_interval: 1h

# In production, replace 'noop' routes above with:
