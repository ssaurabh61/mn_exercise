#     repeat_interval: 15m
#   - match:
#       severity: warning
#     receiver: slack              # post to #fno-alerts, no interrupt
#     repeat_interval: 1h

receivers:
  # No-op receiver — alerts are evaluated and deduplicated by Alertmanager
  # but not forwarded anywhere. Used for preprod where we just want the rules
  # to be valid. Replace with the commented receivers below for production.
  - name: noop

